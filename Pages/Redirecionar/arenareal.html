<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha a Rede Social - Arena Real</title>
</head>
<body>
    <div class="logo"></div>
    <div class="cards">
        <a href="https://www.instagram.com/arenarealbrasil/">
    <div class="card1">
<div class="image"></div>
    </div>
    </a>
    <a href="https://arenarealbrasil.com.br">
    <div class="card2">
<div class="image"></div>
    </div>
</a>
<a href="https://www.facebook.com/p/Arena-Real-Brasil-100083252205179/">
    <div class="card3">
<div class="image"></div>
    </div>
</a>

    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100..900&display=swap');
body{
background-image: url('/Imagens/Background3.png');
background-size: cover;
display: flex;
align-items: center;
height: 90vh;
justify-content: center;
}
.logo{
    width: 300px;
    height: 300px;
    background-image: url('/Imagens/Arena_Real_Logo.png');
background-size: 100%;
background-repeat: no-repeat;
position: absolute;
margin-top: 0px;
top: 0;
}
.card1, .card2, .card3, .card4{
width: 130px;
height: 130px;
background-color: rgb(0 90 70);
border-radius: 20px;
border: 3px solid rgb(205 205 150);
position: relative;
transition:background-color .3s ease, border-color .3s ease;
}
.cards{
position: absolute;
display: flex;
gap: 30px;
top: auto;


}
.card1::after{
mask-image: url('/Imagens/Logo_Instagram.png');
content: "";
position: absolute;
width: 70px;
height: 70px;
background-color: rgb(205 205 150);
mask-size: cover;
mask-repeat: no-repeat;
left: 28px;
top: 28px;
transition:background-color .3s ease;
}

.card2::after{
mask-image: url('/Imagens/globo.png');
content: "";
position: absolute;
width: 70px;
height: 70px;
background-color: rgb(205 205 150);
mask-size: cover;
mask-repeat: no-repeat;
left: 28px;
top: 28px;
mask-position: 0px;
transition:background-color .3s ease;
}

.card3::after{
mask-image: url('/Imagens/Logo_Facebook.png');
content: "";
position: absolute;
width: 70px;
height: 70px;
background-color: rgb(205 205 150);
mask-size: 129%;
mask-repeat: no-repeat;
left: 28px;
mask-position: center;
top: 28px;
transition:background-color .3s ease;
}

.card4::after{
mask-image: url('/Imagens/Logo_Youtube.png');
content: "";
position: absolute;
width: 80px;
height: 80px;
background-color: rgb(205 205 150);
mask-size: cover;
mask-repeat: no-repeat;
left: 25px;
top: 25px;
transition:background-color .3s ease;
}

.card1:hover{
    background-color: rgb(205 205 150);
    border-color: rgb(0 90 70);
}
.card1:hover::after{
    background-color: rgb(0 90 70);
}


.card2:hover{
    background-color: rgb(205 205 150);
    border-color: rgb(0 90 70);
}
.card2:hover::after{
    background-color: rgb(0 90 70);
}


.card3:hover{
    background-color: rgb(205 205 150);
    border-color: rgb(0 90 70);
}
.card3:hover::after{
    background-color: rgb(0 90 70);
}


.card4:hover{
    background-color: rgb(205 205 150);
    border-color: rgb(0 90 70);
}
.card4:hover::after{
    background-color: rgb(0 90 70);
}
body.celular{
 background-size: 400%;   
}

    </style>
        <script>
const largura = document.documentElement.clientWidth;
const body = document.querySelector('body');
console.log(largura)
function verificarTela(){
if(largura < 600){
    body.classList.add('celular');
}
else{
    body.classList.remove('celular');
}
}

window.addEventListener('resize', verificarTela);
window.addEventListener('DOMContentLoaded', verificarTela);
</script>
</body>
</html>
